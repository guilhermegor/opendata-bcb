rules:
  - src: ["pyproject.toml"]
    docs: ["README.md", "docs/usage.md", "docs/contributing.md"]
  - src: [".github/workflows/release*"]
    docs: ["docs/releasing-1-0-0.md", "docs/contributing.md"]
  - src: ["src/opendata_bcb/__init__.py"]
    docs: ["docs/api/reference.md"]
  - src: ["src/opendata_bcb/ingestion/*.py", "src/opendata_bcb/_internal/utils/http_downloader.py"]
    docs: ["docs/api/reference.md", "SECURITY.md"]
  - src: ["poe_tasks*.toml"]
    docs: ["README.md", "docs/contributing.md"]
